name: KC Fix Portable Prerelease
run-name: KC Fix portable 2.1.11-kcfix.3 (${{ github.sha }})

on:
  push:
    branches: [kcfix/portable-release]

permissions:
  contents: read

concurrency:
  group: kcfix-portable-release
  cancel-in-progress: false

env:
  RELEASE_VERSION: 2.1.11-kcfix.3

jobs:
  build:
    if: github.repository == 'KC-Casey/cherry-studio-kcfix' && github.ref == 'refs/heads/kcfix/portable-release'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CHERRY_EDITION: global
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      SENTRY_SOURCE_MAP_UPLOAD: "false"
      NODE_OPTIONS: --max-old-space-size=8192
      GOMEMLIMIT: 10GiB
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v5
      - name: Verify release identity
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if ($package.version -ne $env:RELEASE_VERSION) { throw 'Commit package version does not match release version' }
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'Unexpected checkout revision' }
          Remove-Item Env:WIN_SIGN -ErrorAction SilentlyContinue
      - run: pnpm install --frozen-lockfile
      - name: Inspect exact change scope and affected documentation
        shell: pwsh
        run: |
          $base = 'f369396b28931c1089d85c1a38c4012113f51356'
          pnpm change:scope --base $base
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm docs:affected --base $base
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm check --plan --base $base
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Lint and check formatting of changed TypeScript files
        shell: pwsh
        run: |
          $files = @(git diff --name-only f369396b28931c1089d85c1a38c4012113f51356 HEAD -- '*.ts' '*.tsx' '*.js' '*.mjs' | Where-Object { Test-Path -LiteralPath $_ })
          pnpm exec oxlint --deny-warnings @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec eslint @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec oxfmt --check @files
          if ($LASTEXITCODE -ne 0) {
            pnpm exec oxfmt --write @files
            git diff -- @files
            throw 'Formatting differs from the committed source; apply the diff and rebuild. Nothing will be published.'
          }
      - name: Check documentation contracts
        run: pnpm docs:check
      - name: Check translated UI labels
        run: pnpm i18n:check
      - name: Typecheck application processes
        run: |
          pnpm run typecheck:node
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run typecheck:web
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec tsc --noEmit -p tests/e2e/regression/tsconfig.workbench.json
      - name: Check image editing and data relocation contracts
        run: |
          pnpm rebuild:node
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec vitest run --maxWorkers=1 src/main/ai/utils/__tests__/normalizeImageEditInputs.test.ts src/main/data/db/__tests__/paintingReceiptMigration.test.ts src/main/data/services/__tests__/PaintingService.test.ts src/renderer/pages/paintings/model/__tests__/createPaintingBranch.test.ts src/shared/data/types/__tests__/paintingReceipt.test.ts src/renderer/pages/paintings/hooks/__tests__/usePaintingGenerationSubmit.test.ts src/renderer/pages/paintings/__tests__/PaintingPage.test.tsx src/main/services/userDataRelocation/__tests__/request.test.ts src/main/services/userDataRelocation/__tests__/validation.test.ts src/main/services/userDataRelocation/__tests__/execution.test.ts src/main/services/userDataRelocation/__tests__/skillExports.test.ts src/main/core/preboot/__tests__/userDataLocation.test.ts src/main/core/paths/__tests__/pathRegistry.test.ts src/main/core/paths/__tests__/portable.test.ts src/main/core/application/__tests__/Application.relaunch.test.ts src/main/services/__tests__/AppService.test.ts src/renderer/pages/paintings/components/__tests__/PaintingComposerBranch.test.tsx src/renderer/pages/paintings/components/__tests__/PaintingRecord.test.tsx src/renderer/pages/paintings/components/__tests__/PaintingStrip.test.tsx src/renderer/pages/paintings/components/__tests__/PaintingComposer.test.tsx src/renderer/pages/paintings/components/__tests__/PaintingImageGallery.test.tsx src/renderer/pages/paintings/hooks/__tests__/usePaintingComposerInputFiles.test.ts scripts/e2e/regression/__tests__/cases.test.ts
      - name: Build production bundles
        run: |
          pnpm exec electron-vite build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run build:utility-process
      - name: Verify directory portable packaging contracts
        shell: pwsh
        run: ./scripts/packaging/directory-portable.test.ps1
      - name: Package unsigned Windows x64 application directory
        run: pnpm exec electron-builder --win --x64 --dir --publish never
      - name: Prepare and verify directory portable ZIP and checksums
        shell: pwsh
        run: ./scripts/packaging/directory-portable.ps1 -SourceDirectory dist/win-unpacked -OutputDirectory portable-release -Version $env:RELEASE_VERSION -Commit $env:GITHUB_SHA -RunId $env:GITHUB_RUN_ID
      - name: Exercise delivered ZIP in isolated Windows Electron
        timeout-minutes: 20
        shell: pwsh
        run: ./scripts/e2e/regression/runPackagedWorkbench.ps1 -ArtifactZip "portable-release/cherry-studio-kcfix-$env:RELEASE_VERSION-win-x64-portable.zip" -RunDirectory "$env:RUNNER_TEMP/workbench-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
      - name: Preserve workbench test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kcfix-workbench-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/workbench-${{ github.run_id }}-${{ github.run_attempt }}/report
            ${{ runner.temp }}/workbench-${{ github.run_id }}-${{ github.run_attempt }}/evidence
            ${{ runner.temp }}/workbench-${{ github.run_id }}-${{ github.run_attempt }}/logs
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v6
        with:
          name: kcfix-portable-${{ github.sha }}
          path: portable-release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: github.repository == 'KC-Casey/cherry-studio-kcfix' && github.ref == 'refs/heads/kcfix/portable-release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: kcfix-portable-${{ github.sha }}
          path: portable-release
      - name: Stage, verify and publish fork prerelease
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const { owner, repo } = context.repo;
            if (owner !== 'KC-Casey' || repo !== 'cherry-studio-kcfix') throw new Error('Unexpected release destination');
            const version = process.env.RELEASE_VERSION;
            const tag = `v${version}`;
            const prefix = `cherry-studio-kcfix-${version}-win-x64-portable`;
            const expected = [`${prefix}.zip`, 'README.txt', 'SHA256SUMS'].sort();
            const actual = fs.readdirSync('portable-release').sort();
            if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error('Unexpected artifact contents');
            const hash = data => crypto.createHash('sha256').update(data).digest('hex');
            const sums = fs.readFileSync('portable-release/SHA256SUMS', 'utf8').trim().split(/\r?\n/);
            if (sums.length !== 2) throw new Error('Unexpected checksum count');
            for (const name of expected.filter(name => name !== 'SHA256SUMS')) {
              const digest = hash(fs.readFileSync(`portable-release/${name}`));
              if (!sums.includes(`${digest}  ${name}`)) throw new Error(`Checksum mismatch: ${name}`);
            }
            const readme = fs.readFileSync('portable-release/README.txt', 'utf8');
            if (!readme.includes(`/commit/${context.sha}`) || !readme.includes(version)) throw new Error('Artifact provenance mismatch');
            async function requireAbsent(request) {
              try { await request(); } catch (error) { if (error.status === 404) return; throw error; }
              throw new Error(`Refusing to replace existing ${tag} tag or release; inspect any earlier draft/run manually`);
            }
            await requireAbsent(() => github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` }));
            await requireAbsent(() => github.rest.repos.getReleaseByTag({ owner, repo, tag }));
            const drafts = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            if (drafts.some(release => release.tag_name === tag)) throw new Error('Existing draft requires manual inspection');
            const { data: release } = await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, target_commitish: context.sha,
              name: `cherry-studio-kcfix ${version} - Windows directory portable preview`,
              body: readme, draft: true, prerelease: true, make_latest: 'false'
            });
            core.notice(`Staging draft release ${release.id}; failures leave it unpublished for inspection`);
            for (const name of expected) {
              const data = fs.readFileSync(`portable-release/${name}`);
              const { data: asset } = await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name, data,
                headers: { 'content-type': 'application/octet-stream', 'content-length': data.length }
              });
              if (asset.state !== 'uploaded' || asset.size !== data.length) throw new Error(`Upload incomplete: ${name}`);
              const downloaded = await github.rest.repos.getReleaseAsset({
                owner, repo, asset_id: asset.id, headers: { accept: 'application/octet-stream' }
              });
              if (hash(Buffer.from(downloaded.data)) !== hash(data)) throw new Error(`Uploaded bytes differ: ${name}`);
            }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { owner, repo, release_id: release.id });
            if (JSON.stringify(assets.map(asset => asset.name).sort()) !== JSON.stringify(expected)) throw new Error('Release asset list mismatch');
            try {
              const { data: stagedRef } = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              if (stagedRef.object.type !== 'commit' || stagedRef.object.sha !== context.sha) {
                throw new Error('Staged tag targets another object; refusing publication');
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const { data: published } = await github.rest.repos.updateRelease({
              owner, repo, release_id: release.id, draft: false, prerelease: true, make_latest: 'false'
            });
            const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
            if (ref.object.sha !== context.sha || published.draft || !published.prerelease) throw new Error('Published release verification failed; inspect before retrying');
            await core.summary.addLink('Download portable prerelease', published.html_url).write();
